            <p>Turnkey engineering, procurement, and construction (EPC) for state highways, industrial corridors, bridges, and smart urban infrastructure.</p>
          </article>
          <article>
            <h3>3. RashBhar Health Care</h3>

          <article>

          <article>
            <h3>5. RashBhar Soil & Soul (Agritech)</h3>

          </article>
          <article>
            <h3>6. RashBhar Real Estate</h3>
            <p>Integrated premium residential enclaves (Reyansh Elanza), Grade-A commercial developments, and planned township ecosystems.</p>
